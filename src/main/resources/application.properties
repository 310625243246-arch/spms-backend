spring.application.name=spms-backend

# ---- MySQL ----
spring.datasource.url=jdbc:mysql://localhost:3306/spms_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Vidhya_15@2008
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- Server ----
server.port=8080

# ---- JWT ----
# 256-bit (32+ char) secret used to sign JWTs. Change this for any real deployment.
spms.jwt.secret=change-this-to-a-long-random-secret-key-min-32-chars-for-hs256
spms.jwt.expiration-ms=86400000



# ---- Queue ----
# Average minutes it takes to fully process one farmer, used to estimate wait time
spms.queue.average-service-minutes=5

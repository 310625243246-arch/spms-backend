spring.application.name=spms-backend

# ---- MySQL ----
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ---- Server ----
server.port=${PORT:8080}

# ---- JWT ----
spms.jwt.secret=${SPMS_JWT_SECRET}
spms.jwt.expiration-ms=86400000

# ---- CORS ----
spms.cors.allowed-origin=${SPMS_CORS_ALLOWED_ORIGIN:http://localhost:5173}

# ---- Queue ----
spms.queue.average-service-minutes=5